[package]
name = "agentsquad"
version = "0.14.4"
edition = "2021"
description = "Lightweight project-based terminal session manager"
license = "MIT"
repository = "https://github.com/Hannoah/AgentSquad"

[[bin]]
name = "squad"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
# Pinned: 0.9 hangs console clients at startup in console-less environments
# (it adds PSEUDOCONSOLE_INHERIT_CURSOR to CreatePseudoConsole flags).
# Revisit when upstream fixes it.
portable-pty = "0.8"
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
# Keep symbols unstripped: stripped unsigned binaries trigger false positives
# in heuristic AV scanners (e.g. AhnLab V3).
strip = false
