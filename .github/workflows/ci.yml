name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Fails when a dependency in Cargo.lock has a published RustSec advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
  # A README saved in the wrong encoding turns punctuation into "??" or U+FFFD
  # (it happened in v0.15.19). Neither belongs in the README.
  readme-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          if grep -nF -e '??' -e "$(printf '\xef\xbf\xbd')" README.md; then
            echo "::error file=README.md::Corrupted characters ('??' or U+FFFD); restore them and save as UTF-8"
            exit 1
          fi
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
