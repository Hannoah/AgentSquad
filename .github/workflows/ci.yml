name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Fails when a dependency in Cargo.lock has a published RustSec advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit
      - run: cargo audit
  # A README saved in the wrong encoding turns punctuation into "??" or U+FFFD
  # (it happened in v0.15.19). Neither belongs in the README.
  readme-encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          if grep -nF -e '??' -e "$(printf '\xef\xbf\xbd')" README.md; then
            echo "::error file=README.md::Corrupted characters ('??' or U+FFFD); restore them and save as UTF-8"
            exit 1
          fi
  check:
    # A hung test otherwise holds a runner for six hours (and blocks the
    # macOS queue for every later push). A normal run takes a few minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to commit SHAs (comments name the
      # tag), so a retagged upstream release cannot inject code into CI.
      # Re-pin with the tag's current SHA to take an upstream update.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
